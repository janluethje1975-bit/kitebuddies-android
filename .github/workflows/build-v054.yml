name: Build Kitebuddies v0.54

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kitebuddies_v0.54_GitHub_Source.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack v0.54 source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q Kitebuddies_v0.54_GitHub_Source.zip -d buildsrc

      - name: Set Firebase-compatible minSdk
        run: |
          sed -i "s/minSdk 23/minSdk 24/" buildsrc/app/build.gradle
          grep -n "minSdk" buildsrc/app/build.gradle

      - name: Build unsigned release APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Restore permanent signing keystore
        env:
          KB_KEYSTORE_B64: ${{ secrets.KB_KEYSTORE_B64 }}
        run: |
          if [ -z "$KB_KEYSTORE_B64" ]; then
            echo "::error::Missing repository secret KB_KEYSTORE_B64"
            exit 1
          fi
          printf '%s' "$KB_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kitebuddies-pro.jks"

      - name: Align and sign release APK
        env:
          KB_KEYSTORE_PASSWORD: ${{ secrets.KB_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KB_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret KB_KEYSTORE_PASSWORD"
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_VERSION="$(ls -1 "$SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$ZIPALIGN" -f 4             buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk             buildsrc/app/build/outputs/apk/release/app-release-aligned.apk

          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/kitebuddies-pro.jks"             --ks-type PKCS12             --ks-key-alias kitebuddiespro             --ks-pass env:KB_KEYSTORE_PASSWORD             --key-pass env:KB_KEYSTORE_PASSWORD             --out buildsrc/app/build/outputs/apk/release/Kitebuddies_Nord_Forecast_Pro_v0.54_Beta.apk             buildsrc/app/build/outputs/apk/release/app-release-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs             buildsrc/app/build/outputs/apk/release/Kitebuddies_Nord_Forecast_Pro_v0.54_Beta.apk

          CERT_SHA256="$("$APKSIGNER" verify --print-certs buildsrc/app/build/outputs/apk/release/Kitebuddies_Nord_Forecast_Pro_v0.54_Beta.apk | awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}')"
          EXPECTED_SHA256="58d95162f9201e462d4b1877203af17e05c930999196834e984d28bd57024163"

          if [ "$CERT_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Signing certificate fingerprint mismatch"
            exit 1
          fi

          rm -f "$RUNNER_TEMP/kitebuddies-pro.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitebuddies-v0.54-signed
          path: buildsrc/app/build/outputs/apk/release/Kitebuddies_Nord_Forecast_Pro_v0.54_Beta.apk
          if-no-files-found: error
