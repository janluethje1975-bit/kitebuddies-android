name: Kitebuddies v0.78 Beta Android (v83) – signed RC4 upgrade
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-v078-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Extract verified RC4 sources and Firebase configuration
        run: |
          set -euo pipefail
          echo "ad63a428a3f95dbe58e68d7747dd77d55fe204a14b874a726e0ac609a64948df  Kitebuddies_v077_Beta_RC4_Android_Source.zip" | sha256sum -c -
          echo "aaaae50207e0546f60d9e33eab0d6dce9b1e66a9652abed9bb58c95f70194a5c  Kitebuddies_v0.75_Beta_AdminPush_Android_Source_v77.zip" | sha256sum -c -
          mkdir -p buildsrc release
          unzip -q Kitebuddies_v077_Beta_RC4_Android_Source.zip -d buildsrc
          python3 - <<'PY_CONFIG'
          import zipfile,pathlib,re,json
          old=pathlib.Path('Kitebuddies_v0.75_Beta_AdminPush_Android_Source_v77.zip')
          with zipfile.ZipFile(old) as src:
              dest=pathlib.Path('buildsrc/app/google-services.json')
              dest.write_bytes(src.read('app/google-services.json'))
              cfg=json.loads(dest.read_text(encoding='utf-8'))
              assert any(c.get('client_info',{}).get('android_client_info',{}).get('package_name')=='de.kitebuddies.forecast.prc' for c in cfg.get('client',[])), 'Firebase package ID mismatch'
              old_manifest=src.read('app/src/main/AndroidManifest.xml').decode('utf-8')
              match=re.search(r'android:label="([^"]+)"',old_manifest)
              assert match is not None, 'Existing Android launcher label missing'
              manifest=pathlib.Path('buildsrc/app/src/main/AndroidManifest.xml')
              manifest.write_text(re.sub(r'android:label="[^"]+"','android:label="'+match.group(1)+'"',manifest.read_text(),count=1))
          PY_CONFIG
      - name: Patch v0.78 version and preserve RC4 native capabilities
        run: |
          python3 .github/workflows/patch_v078.py
          grep -q "applicationId 'de.kitebuddies.forecast.prc'" buildsrc/app/build.gradle
          grep -q 'versionCode 83' buildsrc/app/build.gradle
          grep -Fq "versionName '0.78 Beta'" buildsrc/app/build.gradle
          grep -q 'compileSdk 36' buildsrc/app/build.gradle
          grep -q 'targetSdk 36' buildsrc/app/build.gradle
          grep -q "id 'com.google.gms.google-services'" buildsrc/app/build.gradle
          grep -q 'ANDROID_HOME="https://api.kitebuddies-nord.de/web-beta/android.php"' buildsrc/app/src/main/java/de/kitebuddies/forecast/prc/MainActivity.java
          test -s buildsrc/app/src/main/assets/kb-push-diagnostics-rc4.js
          for f in buildsrc/app/src/main/assets/*.js; do node --check "$f"; done
      - name: Build unsigned regular v0.78 APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Sign and verify original beta certificate
        env:
          KB_KEYSTORE_B64: ${{ secrets.KB_KEYSTORE_B64 }}
          KB_KEYSTORE_PASSWORD: ${{ secrets.KB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KB_KEYSTORE_B64" || { echo '::error::Missing existing signing secret'; exit 1; }
          test -n "$KB_KEYSTORE_PASSWORD" || { echo '::error::Missing existing signing password'; exit 1; }
          printf '%s' "$KB_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kb-pro.jks"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS_VERSION="$(ls -1 "$SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          "$SDK_ROOT/build-tools/$TOOLS_VERSION/zipalign" -f 4 buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk release/aligned.apk
          "$SDK_ROOT/build-tools/$TOOLS_VERSION/apksigner" sign --ks "$RUNNER_TEMP/kb-pro.jks" --ks-type PKCS12 \
            --ks-key-alias kitebuddiespro --ks-pass env:KB_KEYSTORE_PASSWORD \
            --key-pass env:KB_KEYSTORE_PASSWORD --out release/Kitebuddies_v0.78_Beta.apk release/aligned.apk
          "$SDK_ROOT/build-tools/$TOOLS_VERSION/apksigner" verify --verbose --print-certs release/Kitebuddies_v0.78_Beta.apk
          CERT_SHA256="$("$SDK_ROOT/build-tools/$TOOLS_VERSION/apksigner" verify --print-certs release/Kitebuddies_v0.78_Beta.apk | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          test "$CERT_SHA256" = '58d95162f9201e462d4b1877203af17e05c930999196834e984d28bd57024163' || { echo '::error::Wrong signing certificate'; exit 1; }
          sha256sum release/Kitebuddies_v0.78_Beta.apk > release/APK_SHA256.txt
          rm -f "$RUNNER_TEMP/kb-pro.jks" release/aligned.apk
      - name: Write update manifest for review only
        run: |
          python3 - <<'PY_MANIFEST'
          import pathlib,hashlib,json,datetime
          apk=pathlib.Path('release/Kitebuddies_v0.78_Beta.apk')
          assert apk.stat().st_size>1000000, 'Signed APK missing'
          data={'channel':'beta','packageName':'de.kitebuddies.forecast.prc','versionCode':83,
            'versionName':'0.78 Beta','mandatory':False,
            'apkUrl':'https://api.kitebuddies-nord.de/updates/pro/Kitebuddies_v0.78_Beta.apk',
            'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'changes':['GPS-Standort und Genauigkeitskreis','Coastal Wind Forecast A/B','einheitliche Karten- und Forecast-Filterzeile',
             'zentrale Feedbackbewertungen mit sieben Tagen Sessionkalender','Android Firebase-Push und Alarme weiterhin Forecast A']}
          pathlib.Path('release/v078_UPDATE_MANIFEST_NICHT_AUTOMATISCH_VEROEFFENTLICHEN.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY_MANIFEST
      - name: Upload signed APK as private workflow artifact – no server deployment
        uses: actions/upload-artifact@v4
        with:
          name: Kitebuddies-v078-Beta-signed-TEST
          path: |
            release/Kitebuddies_v0.78_Beta.apk
            release/APK_SHA256.txt
            release/v078_UPDATE_MANIFEST_NICHT_AUTOMATISCH_VEROEFFENTLICHEN.json
          retention-days: 30
          if-no-files-found: error
