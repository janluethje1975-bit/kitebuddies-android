name: Kitebuddies v0.76 Beta STAGE (from verified v0.75 v77)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v076-stage-from-v077.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Prepare v0.76 source from verified v0.75 v77
        env:
          KB_PATCH_B64: ''
        run: |
          python3 - <<'PY_BUILD'
          import base64,hashlib,os,pathlib,subprocess,zipfile,zlib
          source=pathlib.Path('Kitebuddies_v0.75_Beta_AdminPush_Android_Source_v77.zip')
          assert source.is_file(), 'Missing v0.75 v77 source ZIP in GitHub root'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='aaaae50207e0546f60d9e33eab0d6dce9b1e66a9652abed9bb58c95f70194a5c', 'Base source changed'
          patch=zlib.decompress(base64.b64decode(os.environ['KB_PATCH_B64']))
          assert hashlib.sha256(patch).hexdigest()=='382c33cc3a199cbf7985f6704a39fa1edbf364f7a092eab266c8d71dae94199b', 'Patch changed'
          with zipfile.ZipFile(source) as z: z.extractall('buildsrc')
          subprocess.run(['patch','-p1','-d','buildsrc','--batch','--forward'],input=patch,check=True)
          pathlib.Path('buildsrc/app/google-services.json').unlink(missing_ok=True)
          build=pathlib.Path('buildsrc/app/build.gradle').read_text()
          java=pathlib.Path('buildsrc/app/src/main/java/de/kitebuddies/forecast/prc/MainActivity.java').read_text()
          assert "applicationId 'de.kitebuddies.forecast.prc.stage'" in build
          assert 'versionCode 78' in build
          assert '/web-beta/v076-beta/android.php' in java
          assert 'AndroidSpotFiles' in java and 'onShowFileChooser' in java
          PY_BUILD
      - name: Ensure Android SDK 37
        run: |
          if ! test -f "${ANDROID_HOME}/platforms/android-37/android.jar"; then
            yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"
          fi
      - name: Build release APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Sign and verify APK
        env:
          KB_KEYSTORE_B64: ${{ secrets.KB_KEYSTORE_B64 }}
          KB_KEYSTORE_PASSWORD: ${{ secrets.KB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KB_KEYSTORE_B64"
          test -n "$KB_KEYSTORE_PASSWORD"
          mkdir -p release
          printf '%s' "$KB_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kitebuddies-sign.jks"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS_VERSION="$(ls -1 "$SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          "$SDK_ROOT/build-tools/$TOOLS_VERSION/zipalign" -f 4 buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk release/aligned.apk
          "$SDK_ROOT/build-tools/$TOOLS_VERSION/apksigner" sign --ks "$RUNNER_TEMP/kitebuddies-sign.jks" --ks-type PKCS12 --ks-key-alias kitebuddiespro --ks-pass env:KB_KEYSTORE_PASSWORD --key-pass env:KB_KEYSTORE_PASSWORD --out release/Kitebuddies_v0.76_Beta_STAGE.apk release/aligned.apk
          "$SDK_ROOT/build-tools/$TOOLS_VERSION/apksigner" verify --verbose --print-certs release/Kitebuddies_v0.76_Beta_STAGE.apk
          CERT_SHA256="$("$SDK_ROOT/build-tools/$TOOLS_VERSION/apksigner" verify --print-certs release/Kitebuddies_v0.76_Beta_STAGE.apk | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          test "$CERT_SHA256" = '58d95162f9201e462d4b1877203af17e05c930999196834e984d28bd57024163'
          sha256sum release/Kitebuddies_v0.76_Beta_STAGE.apk > release/APK_SHA256.txt
          rm -f "$RUNNER_TEMP/kitebuddies-sign.jks" release/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kitebuddies-v076-STAGE-signed
          path: release/
          retention-days: 30
          if-no-files-found: error
