name: Build Kitebuddies v0.72 Beta Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kitebuddies_v0.72_GitHub_Source.zip'
      - '.github/workflows/build-v072.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack v0.72 source
        run: |
          set -euo pipefail
          rm -rf buildsrc release
          mkdir buildsrc release
          unzip -q Kitebuddies_v0.72_GitHub_Source.zip -d buildsrc
          grep -n 'minSdk\|targetSdk\|versionCode\|versionName' buildsrc/app/build.gradle

      - name: Verify v0.72 beta source and critical features
        run: |
          set -euo pipefail
          grep -q 'versionCode 72' buildsrc/app/build.gradle
          grep -q "versionName '0.72 Beta'" buildsrc/app/build.gradle
          grep -q 'minSdk 24' buildsrc/app/build.gradle
          grep -q 'kbAlarmFavoriteSpotIndices' buildsrc/app/src/main/assets/index.html
          grep -q 'kb-bell-on' buildsrc/app/src/main/assets/index.html
          grep -q "KB_LICENSE_API='https://api.kitebuddies-nord.de/license/index.php'" buildsrc/app/src/main/assets/index.html
          grep -q 'installationId:ident.id' buildsrc/app/src/main/assets/index.html
          grep -q 'bootLicensedApp();' buildsrc/app/src/main/assets/index.html
          grep -q 'lp.topMargin=top;' buildsrc/app/src/main/java/de/kitebuddies/forecast/prc/MainActivity.java
          grep -q 'lp.bottomMargin=bottom;' buildsrc/app/src/main/java/de/kitebuddies/forecast/prc/MainActivity.java
          grep -q 'WindowInsets.Type.navigationBars()' buildsrc/app/src/main/java/de/kitebuddies/forecast/prc/MainActivity.java
          grep -q 'now.onclick=()=>startUpdateDownload(manifest);' buildsrc/app/src/main/assets/index.html
          grep -q 'kb-cockpit-tools' buildsrc/app/src/main/assets/index.html
          grep -q 'kb-compare-info' buildsrc/app/src/main/assets/index.html
          grep -q 'pro-wind-map-legend' buildsrc/app/src/main/assets/pro-wind-overlay.css
          grep -q 'proWindMapLegend' buildsrc/app/src/main/assets/pro-wind-overlay.js
          grep -q 'bottom:10px!important' buildsrc/app/src/main/assets/pro-wind-overlay.css
          grep -q 'kbCompareFavoritesOnly' buildsrc/app/src/main/assets/index.html
          grep -q 'kbRenderWindowChecks' buildsrc/app/src/main/assets/index.html
          grep -q 'kb-check-fail' buildsrc/app/src/main/assets/index.html
          grep -q '},20000);return tip' buildsrc/app/src/main/assets/index.html
          grep -q 'const startupScope=opts.startupScope' buildsrc/app/src/main/assets/index.html
          grep -q 'if(!kbRuntimeReady||document.hidden)return;' buildsrc/app/src/main/assets/index.html
          grep -q 'kbMayShowAlarmNotice(r)' buildsrc/app/src/main/assets/index.html
          grep -q 'kbStartupWait(batchRefresh' buildsrc/app/src/main/assets/index.html
          grep -q 'kbAlarmRefreshIfNeeded' buildsrc/app/src/main/assets/index.html
          grep -q 'kbMapPreviewSpotKey' buildsrc/app/src/main/assets/index.html
          grep -q 'kbMarkerGustPair' buildsrc/app/src/main/assets/index.html
          grep -q 'DWD-Böen nicht sicher vergleichbar' buildsrc/app/src/main/assets/index.html
          grep -q 'v0.71: Spotkarte' buildsrc/app/src/main/assets/index.html
          grep -q 'kbMarkerNightNote' buildsrc/app/src/main/assets/index.html
          grep -q 'kb-preview-open' buildsrc/app/src/main/assets/index.html
          grep -q 'v0.69: Wind-Overlay startet immer ausgeschaltet' buildsrc/app/src/main/assets/index.html
          test -s buildsrc/app/src/main/assets/pro-regional-models.js
          test -s buildsrc/app/src/main/assets/pro-thermics.js
          grep -q 'kbThermicInit' buildsrc/app/src/main/assets/index.html
          grep -q 'Cape Doctor / Küstenverstärkung' buildsrc/app/src/main/assets/pro-thermics.js
          grep -q 'kb-thermics-v070.php' buildsrc/app/src/main/assets/pro-weather-api.js
          grep -q 'KBRegionalModels.select' buildsrc/app/src/main/assets/index.html
          grep -q 'kbActivateRegionalModels' buildsrc/app/src/main/assets/index.html
          grep -q 'REGIONAL_MODELS_URL' buildsrc/app/src/main/assets/pro-weather-api.js
          grep -q 'setEnabled(false);' buildsrc/app/src/main/assets/pro-wind-overlay.js
          grep -q 'event.persisted' buildsrc/app/src/main/assets/pro-wind-overlay.js
          grep -q 'drawAfterStyleReady' buildsrc/app/src/main/assets/pro-wind-overlay.js
          grep -q 'state.map.on('"'"'style.load'"'"',drawAfterStyleReady)' buildsrc/app/src/main/assets/pro-wind-overlay.js
          grep -q 'function reconcileOverlay()' buildsrc/app/src/main/assets/pro-wind-overlay.js
          grep -q 'function arrowLayerReady()' buildsrc/app/src/main/assets/pro-wind-overlay.js
          grep -q 'function kbPlaceSpotPreview(entry)' buildsrc/app/src/main/assets/index.html
          grep -q 'v0.69: Wind-Overlay startet immer ausgeschaltet' buildsrc/app/src/main/assets/index.html

      - name: Verify v0.72 measured stations and learning UI
        run: |
          set -euo pipefail
          test -s buildsrc/app/src/main/assets/kb-live-stations.js
          grep -q 'kb-stations-v072.php' buildsrc/app/src/main/assets/kb-live-stations.js
          grep -q 'id="kbStationOpenBtn"' buildsrc/app/src/main/assets/index.html
          ! grep -Eq 'disabled[^>]*id="kbStationOpenBtn"' buildsrc/app/src/main/assets/index.html
          grep -q 'id="kbStationPanel"' buildsrc/app/src/main/assets/index.html
          grep -q 'id="kbModelAccuracyBody"' buildsrc/app/src/main/assets/index.html
          grep -q 'v0.72: Live-Stationen' buildsrc/app/src/main/assets/index.html
          node --check buildsrc/app/src/main/assets/kb-live-stations.js

      - name: Build unsigned release APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Restore permanent signing keystore
        env:
          KB_KEYSTORE_B64: ${{ secrets.KB_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KB_KEYSTORE_B64" || { echo '::error::Missing KB_KEYSTORE_B64'; exit 1; }
          printf '%s' "$KB_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kitebuddies-pro.jks"

      - name: Align, sign and verify APK
        env:
          KB_KEYSTORE_PASSWORD: ${{ secrets.KB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KB_KEYSTORE_PASSWORD" || { echo '::error::Missing KB_KEYSTORE_PASSWORD'; exit 1; }
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_VERSION="$(ls -1 "$SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$ZIPALIGN" -f 4 \
            buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk \
            release/app-release-aligned.apk

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/kitebuddies-pro.jks" \
            --ks-type PKCS12 \
            --ks-key-alias kitebuddiespro \
            --ks-pass env:KB_KEYSTORE_PASSWORD \
            --key-pass env:KB_KEYSTORE_PASSWORD \
            --out release/Kitebuddies_Nord_Forecast_Pro_v0.72_Beta.apk \
            release/app-release-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs \
            release/Kitebuddies_Nord_Forecast_Pro_v0.72_Beta.apk

          CERT_SHA256="$("$APKSIGNER" verify --print-certs release/Kitebuddies_Nord_Forecast_Pro_v0.72_Beta.apk | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          EXPECTED_SHA256='58d95162f9201e462d4b1877203af17e05c930999196834e984d28bd57024163'
          test "$CERT_SHA256" = "$EXPECTED_SHA256" || { echo '::error::Signing certificate fingerprint mismatch'; exit 1; }
          rm -f "$RUNNER_TEMP/kitebuddies-pro.jks" release/app-release-aligned.apk

      - name: Create server update manifest
        run: |
          set -euo pipefail
          APK='release/Kitebuddies_Nord_Forecast_Pro_v0.72_Beta.apk'
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          PUBLISHED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          cat > release/kitebuddies-update.json <<EOF
          {
            "channel": "pro-beta",
            "packageName": "de.kitebuddies.forecast.prc",
            "versionCode": 72,
            "versionName": "0.72 Beta",
            "apkUrl": "https://api.kitebuddies-nord.de/updates/pro/Kitebuddies_Nord_Forecast_Pro_v0.72_Beta.apk",
            "sha256": "$APK_SHA256",
            "mandatory": false,
            "publishedAt": "$PUBLISHED_AT",
            "changes": [
              "Spotkarte: Nahe DWD- und DMI-Messstationen mit echtem Windverlauf und Zeitstempel pruefen.",
              "Stationskennzeichnung zeigt einen Abruf statt pauschal Live-Wind zu behaupten.",
              "Modellgenauigkeit zeigt nur spaeter gepruefte Prognose/Messwert-Paare; Lernserver muss eingerichtet werden.",
              "Forecast, KiteScore, Confidence, Shore, Wind-Overlay, Thermik und Alarme bleiben unveraendert."
            ]
          }
          EOF
          test "$(jq -r '.versionCode' release/kitebuddies-update.json)" = "72" || { echo '::error::Update manifest versionCode mismatch'; exit 1; }
          grep -q '"versionCode": 72' release/kitebuddies-update.json
          cat release/kitebuddies-update.json

      - name: Upload signed APK and update JSON
        uses: actions/upload-artifact@v4
        with:
          name: Kitebuddies-v0.72-signed
          path: |
            release/Kitebuddies_Nord_Forecast_Pro_v0.72_Beta.apk
            release/kitebuddies-update.json
          if-no-files-found: error
