name: Build Kitebuddies v0.55 Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kitebuddies_v0.55_GitHub_Source.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack v0.55 source
        run: |
          rm -rf buildsrc release
          mkdir buildsrc release
          unzip -q Kitebuddies_v0.55_GitHub_Source.zip -d buildsrc
          grep -n "minSdk\|versionCode\|versionName" buildsrc/app/build.gradle

      - name: Build unsigned release APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Restore permanent signing keystore
        env:
          KB_KEYSTORE_B64: ${{ secrets.KB_KEYSTORE_B64 }}
        run: |
          test -n "$KB_KEYSTORE_B64" || { echo "::error::Missing KB_KEYSTORE_B64"; exit 1; }
          printf '%s' "$KB_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kitebuddies-pro.jks"

      - name: Align, sign and verify APK
        env:
          KB_KEYSTORE_PASSWORD: ${{ secrets.KB_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KB_KEYSTORE_PASSWORD" || { echo "::error::Missing KB_KEYSTORE_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_VERSION="$(ls -1 "$SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$ZIPALIGN" -f 4 \
            buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk \
            release/app-release-aligned.apk

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/kitebuddies-pro.jks" \
            --ks-type PKCS12 \
            --ks-key-alias kitebuddiespro \
            --ks-pass env:KB_KEYSTORE_PASSWORD \
            --key-pass env:KB_KEYSTORE_PASSWORD \
            --out release/Kitebuddies_Nord_Forecast_Pro_v0.55_Beta.apk \
            release/app-release-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs \
            release/Kitebuddies_Nord_Forecast_Pro_v0.55_Beta.apk

          CERT_SHA256="$("$APKSIGNER" verify --print-certs release/Kitebuddies_Nord_Forecast_Pro_v0.55_Beta.apk | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          EXPECTED_SHA256="58d95162f9201e462d4b1877203af17e05c930999196834e984d28bd57024163"
          test "$CERT_SHA256" = "$EXPECTED_SHA256" || { echo "::error::Signing certificate fingerprint mismatch"; exit 1; }
          rm -f "$RUNNER_TEMP/kitebuddies-pro.jks" release/app-release-aligned.apk

      - name: Create server update manifest
        run: |
          APK="release/Kitebuddies_Nord_Forecast_Pro_v0.55_Beta.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          PUBLISHED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          cat > release/kitebuddies-update.json <<EOF
          {
            "channel": "pro-beta",
            "packageName": "de.kitebuddies.forecast.prc",
            "versionCode": 55,
            "versionName": "0.55 Beta",
            "apkUrl": "https://api.kitebuddies-nord.de/updates/pro/Kitebuddies_Nord_Forecast_Pro_v0.55_Beta.apk",
            "sha256": "$APK_SHA256",
            "mandatory": false,
            "publishedAt": "$PUBLISHED_AT",
            "notes": "Android-Statusleisten-Fix: Uhrzeit, WLAN und Akku werden wieder in einem eigenen dunklen Systembalken oberhalb der App angezeigt. Forecast-, Karten-, Firebase-, Push- und Alarmregel-Logik bleiben gegenüber v0.54 unverändert."
          }
          EOF
          cat release/kitebuddies-update.json

      - name: Upload signed APK and update JSON
        uses: actions/upload-artifact@v4
        with:
          name: Kitebuddies-v0.55-release
          path: |
            release/Kitebuddies_Nord_Forecast_Pro_v0.55_Beta.apk
            release/kitebuddies-update.json
          if-no-files-found: error
